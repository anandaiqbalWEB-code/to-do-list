<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1>To-Do-List + branch</h1>

        <form class="form">

            <input type="text" id="tugas" placeholder="Masukkan Tugas">

            <button id="tambahTugas">Tambah</button>

        </form>

        <input type="text" id="filter" placeholder="Cari Tugas">

        <div class="kondisi-tugas">

            <button id="semua" class="menyala active">Semua</button>

            <button id="aktif" class="menyala">Aktif</button>

            <button id="selesai" class="menyala">Selesai</button>

        </div>

        <!-- BERBAGAI TUGAS DISINI  -->

        <div id="tugasList"></div>

        <hr>

        <div class="total-bottom">

            <div>Total Tugas : <span id="jumlahTugas">0</span></div>

            <button onclick="hapusSelesai()">Hapus Selesai</button>

        </div>

        <script src="main.js"></script>

    </div>

</body>

</html>
